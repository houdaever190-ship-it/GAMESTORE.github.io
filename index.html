<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME STORE</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; text-align: right; direction: rtl; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; direction: ltr; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand"><img src="logo_UD.png" alt="" width="28" height="28"><b>GAME STORE</b></div>
<div id="wrap">
  <div id="state">جاري فحص نظام الجهاز...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; 

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "إصدار النظام الحالي: <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <b class='ok'>مدعوم</b>"
                     : " &middot; <span class='bad'>غير مدعوم في هذا الإصدار</span>");

    var target = "jb.html" + location.search;
    
    if (supported) {
        if (fwnum === 1352) {
            target = "jb.html?load=goldhen_2.4b18.10.bin" + (location.search ? "&" + location.search.substring(1) : "");
        } else {
            target = "jb.html?load=hen.bin" + (location.search ? "&" + location.search.substring(1) : "");
        }
    }

    function go() { setState("جاري تحميل التعديل المناسب لجهازك...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("نظام الجهاز غير مدعوم تلقائياً", "bad");
        waitForTap("نظام غير مدعوم (" + (key || "غير معروف") + ") -- اضغط X أو المس الشاشة للتشغيل على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع الأوفلاين -- يتم التشغيل من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم الحفظ في الذاكرة المؤقتة مسبقاً", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث بنجاح", true);
        waitForTap("التحديث جاهز -- اضغط X أو المس الشاشة لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جاري فحص الذاكرة المؤقتة...");
        ac.addEventListener("downloading",
            function () { setCache("جاري حفظ الملفات لتشغيلها بدون إنترنت (للمرة الأولى)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جاري الحفظ: " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم الحفظ بنجاح للاستخدام بدون إنترنت", true);
            waitForTap("اكتمل الحفظ -- اضغط X أو المس الشاشة للتشغيل الآن", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تحميل التحديث بنجاح", true);
            waitForTap("التحديث جاهز -- اضغط X أو المس الشاشة لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("الملفات محدثة وجاهزة للاستخدام بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("فشل الحفظ في الذاكرة المؤقتة");
            waitForTap("فشل التخزين -- اضغط X أو المس الشاشة للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الملفات المخزنة قديمة");
            waitForTap("ملفات قديمة -- اضغط X أو المس الشاشة للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
